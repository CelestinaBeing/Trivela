name: Frontend CI

on:
  # Runs on pull requests (full contributor CI). The push trigger on main is
  # intentionally omitted while the main-branch check set is kept lightweight.
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate env examples
        run: npm run env:validate

      - name: Detect optional frontend scripts
        id: scripts
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('./frontend/package.json', 'utf8'));
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, 'has_lint=' + (pkg.scripts?.lint ? 'true' : 'false') + '\n');
          fs.appendFileSync(out, 'has_format_check=' + (pkg.scripts?.['format:check'] ? 'true' : 'false') + '\n');
          fs.appendFileSync(out, 'has_test=' + (pkg.scripts?.test ? 'true' : 'false') + '\n');
          EOF

      - name: Build frontend (via Turborepo)
        run: npx turbo run build --filter=frontend

      - name: Bundle size budget gate
        run: node scripts/check-bundle-size.mjs

      - name: Upload frontend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

      - name: Install Playwright browsers
        if: steps.scripts.outputs.has_test == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint frontend (via Turborepo)
        if: steps.scripts.outputs.has_lint == 'true'
        run: npx turbo run lint --filter=frontend

      - name: Check frontend formatting
        if: steps.scripts.outputs.has_format_check == 'true'
        run: npm run format:check --workspace=frontend

      - name: Test frontend (via Turborepo)
        if: steps.scripts.outputs.has_test == 'true'
        run: npx turbo run test --filter=frontend

      - name: Coverage gate — unit tests with thresholds
        run: npm run test:coverage --workspace=frontend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Upload Playwright artifacts on failure
        if: failure() && steps.scripts.outputs.has_test == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  cross-browser-e2e:
    name: Cross-browser E2E (Chromium/Firefox/WebKit)
    runs-on: ubuntu-latest
    needs: frontend

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Playwright browser - ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests - ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}
        working-directory: frontend

      - name: Upload test results - ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Generate browser-specific summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## E2E Results - ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          if [ -f frontend/playwright-report/index.html ]; then
            echo "✅ Tests completed on ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
            echo "📊 Full report available in artifacts: \`playwright-results-${{ matrix.browser }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test report generated for ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          fi
